<!DOCTYPE html>
<!--
  Custom HTML shell for the Yandex Games build of "Ночное дежурство: Палата 0".

  Godot folds this file into build/yandex/index.html at export time
  (export_presets.cfg, html/custom_html_shell) and substitutes $GODOT_URL,
  $GODOT_PROJECT_NAME, $GODOT_HEAD_INCLUDE, $GODOT_CONFIG and
  $GODOT_THREADS_ENABLED. It is a source file, not a build artifact.

  Two checks read it by literal substring, so renaming a symbol here breaks
  them even when the page still works: validate_yandex_integration.gd reads
  this file, tools/build/pack_yandex_zip.py reads the produced index.html.
  Both exist because a failed custom-shell export falls back to Godot's
  default page silently, taking every SDK hook with it. See project/web/README.md.

  Rebuilt from that contract on 18 September 2026 after the original was lost
  to a .gitignore rule. It has not been run against a real export, a browser or
  the Yandex SDK - do that before shipping.
-->
<html lang="ru">
<head>
	<meta charset="utf-8">
	<!-- viewport-fit=cover so the canvas reaches under a notch instead of
	     being letterboxed by the browser; user-scalable=no because a
	     pinch-zoom on a game canvas is never intentional. -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<title data-i18n="title">$GODOT_PROJECT_NAME</title>
	$GODOT_HEAD_INCLUDE
	<!-- Yandex serves the SDK from the site root and refuses builds that pack
	     their own copy, so this path is absolute and sdk.js is never bundled. -->
	<script src="/sdk.js"></script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background-color: #01030a;
			color: #b4c0b1;
			font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
			/* No text selection, no callout, no pull-to-refresh, no double-tap
			   zoom: all four fire constantly under a thumb on the look half. */
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
			-webkit-tap-highlight-color: transparent;
			touch-action: none;
			overscroll-behavior: none;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			outline: none;
		}

		#canvas:focus {
			outline: none;
		}

		#boot {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 18px;
			padding: 24px;
			background-color: #01030a;
			text-align: center;
			transition: opacity 0.4s ease;
		}

		#boot.boot--gone {
			opacity: 0;
			pointer-events: none;
		}

		#boot-title {
			font-size: 20px;
			letter-spacing: 0.16em;
			text-transform: uppercase;
			color: #7e8f7d;
		}

		#boot-bar {
			width: min(320px, 64vw);
			height: 4px;
			background-color: #121a16;
			border-radius: 2px;
			overflow: hidden;
		}

		#boot-fill {
			width: 0;
			height: 100%;
			background-color: #5c7a60;
			transition: width 0.2s ease;
		}

		#boot-status {
			font-size: 14px;
			color: #5f6c5e;
			max-width: 36em;
			line-height: 1.5;
		}

		#boot-status.boot-status--error {
			color: #c2625a;
		}

		/* The rotate notice is display:none by default and only the media query
		   below turns it on, so a desktop browser narrower than it is tall -
		   a docked window, a dev-tools split - never sees it. */
		#rotate-notice {
			position: absolute;
			inset: 0;
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 20px;
			padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
			background-color: #01030a;
			text-align: center;
			z-index: 10;
		}

		#rotate-icon {
			width: 76px;
			height: 46px;
			border: 3px solid #7e8f7d;
			border-radius: 8px;
			animation: rotate-hint 2.4s ease-in-out infinite;
		}

		#rotate-text {
			font-size: 19px;
			line-height: 1.5;
			color: #9fae9c;
			max-width: 20em;
		}

		@keyframes rotate-hint {
			0%, 40% { transform: rotate(90deg); }
			60%, 100% { transform: rotate(0deg); }
		}

		@media (prefers-reduced-motion: reduce) {
			#rotate-icon { animation: none; transform: rotate(0deg); }
		}

		/* The whole point: landscape-only controls on a phone held upright.
		   Gated on .mobile-device so a portrait desktop window is left alone. */
		@media (orientation: portrait) {
			body.mobile-device #rotate-notice {
				display: flex;
			}
		}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0">
		<span data-i18n="noCanvas">Вашему браузеру не хватает поддержки HTML5 canvas.</span>
	</canvas>

	<div id="rotate-notice" role="alertdialog" aria-live="polite">
		<div id="rotate-icon" aria-hidden="true"></div>
		<p id="rotate-text" data-i18n="rotate">Поверните устройство горизонтально.</p>
	</div>

	<div id="boot">
		<div id="boot-title" data-i18n="title">Ночное дежурство: Палата 0</div>
		<div id="boot-bar"><div id="boot-fill"></div></div>
		<div id="boot-status" data-i18n="loading">Отделение готовится…</div>
	</div>

	<script>
		"use strict";

		// --- shell localisation ---------------------------------------------
		// The engine has its own translations; these are only the strings shown
		// before and around it, so they follow navigator.language rather than
		// the player's in-game choice, which is not loaded yet.
		const SHELL_TEXT = {
			ru: {
				title: "Ночное дежурство: Палата 0",
				loading: "Отделение готовится…",
				rotate: "Поверните устройство горизонтально.",
				noCanvas: "Вашему браузеру не хватает поддержки HTML5 canvas.",
				missing: "Браузер не поддерживает нужные возможности:",
				failed: "Не удалось запустить игру. Обновите страницу."
			},
			en: {
				title: "Night Duty: Room 0",
				loading: "Preparing the ward…",
				rotate: "Please turn your device to landscape.",
				noCanvas: "Your browser is missing HTML5 canvas support.",
				missing: "Your browser is missing required features:",
				failed: "The game could not start. Please reload the page."
			}
		};

		const SHELL_LANG = String(navigator.language || "ru").toLowerCase().startsWith("ru") ? "ru" : "en";

		function shellText(key) {
			return (SHELL_TEXT[SHELL_LANG] || SHELL_TEXT.ru)[key] || "";
		}

		function applyShellText() {
			document.documentElement.lang = SHELL_LANG;
			document.title = shellText("title");
			document.querySelectorAll("[data-i18n]").forEach(function (node) {
				const value = shellText(node.getAttribute("data-i18n"));
				if (value) {
					node.textContent = value;
				}
			});
		}

		applyShellText();

		// --- page-level input suppression ------------------------------------
		// A long press on the canvas opens the context menu mid-swipe, and a
		// drag selects the page instead of turning the camera.
		["contextmenu", "dragstart", "selectstart"].forEach(function (name) {
			window.addEventListener(name, function (event) {
				event.preventDefault();
			}, { passive: false });
		});
		// Chrome only treats a touchmove listener as cancellable when it is
		// registered non-passively; without this the page still rubber-bands
		// under the joystick on some Android builds.
		document.addEventListener("touchmove", function (event) {
			if (event.cancelable) {
				event.preventDefault();
			}
		}, { passive: false });

		// --- portrait handling ------------------------------------------------
		const isTouchDevice = navigator.maxTouchPoints > 0
			|| window.matchMedia("(pointer: coarse)").matches;
		if (isTouchDevice) {
			document.body.classList.add("mobile-device");
		}

		// --- bridge to Godot ---------------------------------------------------
		// yandex_sdk.gd picks this object up with
		// JavaScriptBridge.get_interface("YandexGamesBridge") and hands us a
		// callback. Only primitives cross the bridge, so every payload is a
		// JSON string. Events raised before Godot connects are buffered: the SDK
		// regularly resolves before the engine has finished booting, and a
		// dropped sdk_ready leaves the game convinced it is running offline.
		let godotCallback = null;
		const pendingEvents = [];
		let ysdk = null;
		let ysdkPlayer = null;
		let sdkSettled = false;
		let gameplayRunning = false;
		let loadingReported = false;

		function emit(name, payload) {
			if (godotCallback === null) {
				pendingEvents.push([name, payload || ""]);
				return;
			}
			try {
				godotCallback(name, payload || "");
			} catch (error) {
				console.error("[palata] bridge callback failed", name, error);
			}
		}

		function markSdkUnavailable() {
			if (sdkSettled) {
				return;
			}
			sdkSettled = true;
			emit("sdk_unavailable", "");
		}

		window.YandexGamesBridge = {
			connectGodot: function (callback) {
				godotCallback = callback;
				while (pendingEvents.length > 0) {
					const event = pendingEvents.shift();
					try {
						godotCallback(event[0], event[1]);
					} catch (error) {
						console.error("[palata] buffered event failed", event[0], error);
					}
				}
			},

			// Called once the ward is built and the menu is on screen, never at
			// page load: Yandex measures time-to-playable from this call.
			loadingReady: function () {
				loadingReported = true;
				if (ysdk) {
					try {
						ysdk.features.LoadingAPI?.ready();
					} catch (error) {
						console.warn("[palata] LoadingAPI.ready failed", error);
					}
				}
			},

			setGameplayActive: function (value) {
				gameplayRunning = Boolean(value);
				if (!ysdk) {
					return;
				}
				try {
					if (gameplayRunning) {
						ysdk.features.GameplayAPI?.start();
					} else {
						ysdk.features.GameplayAPI?.stop();
					}
				} catch (error) {
					console.warn("[palata] GameplayAPI failed", error);
				}
			},

			// Must always end in ad_close. The Godot side is sitting on a
			// callback that reveals the ending panel or starts the next night,
			// so a silent failure here is a black screen, not a missing ad.
			// yandex_sdk.gd keeps a 10 s watchdog for the case where the
			// platform accepts the call and then never calls back at all.
			showInterstitial: function () {
				if (!ysdk) {
					emit("ad_close", "");
					return;
				}
				try {
					ysdk.adv.showFullscreenAdv({
						callbacks: {
							onOpen: function () {
								emit("ad_open", "");
							},
							onClose: function () {
								emit("ad_close", "");
							},
							onError: function (error) {
								console.warn("[palata] interstitial error", error);
								emit("ad_close", "");
							}
						}
					});
				} catch (error) {
					console.warn("[palata] showFullscreenAdv threw", error);
					emit("ad_close", "");
				}
			},

			// flushCloud is set for a finished shift and for the save made just
			// before an ad, the two moments where a page reload would otherwise
			// lose a night's progress.
			saveData: function (json, flushCloud) {
				if (!ysdkPlayer) {
					return;
				}
				let parsed = null;
				try {
					parsed = JSON.parse(json);
				} catch (error) {
					console.error("[palata] progress is not valid JSON", error);
					return;
				}
				try {
					ysdkPlayer.setData({ palata0: parsed }, Boolean(flushCloud))
						.catch(function (error) {
							console.warn("[palata] player.setData failed", error);
						});
				} catch (error) {
					console.warn("[palata] player.setData threw", error);
				}
			}
		};

		// --- Yandex SDK boot ----------------------------------------------------
		// Runs in parallel with the engine download. Every failure path ends in
		// sdk_unavailable so the game stops waiting and runs on local saves.
		const SDK_INIT_TIMEOUT_MS = 10000;
		window.setTimeout(function () {
			if (!sdkSettled) {
				console.warn("[palata] SDK did not initialise in time");
				markSdkUnavailable();
			}
		}, SDK_INIT_TIMEOUT_MS);

		if (typeof YaGames === "undefined") {
			// /sdk.js only resolves on the platform; opening the build directly
			// is a normal local-testing case, not an error.
			console.info("[palata] Yandex SDK not present, running standalone");
			markSdkUnavailable();
		} else {
			YaGames.init()
				.then(function (sdk) {
					ysdk = sdk;
					sdkSettled = true;

					let language = "ru";
					let deviceType = isTouchDevice ? "mobile" : "desktop";
					try {
						language = String(sdk.environment.i18n.lang || "ru").slice(0, 2);
					} catch (error) {
						console.warn("[palata] no language in environment", error);
					}
					try {
						// desktop | mobile | tablet | tv - anything else is
						// discarded by _apply_environment_payload().
						deviceType = String(sdk.deviceInfo.type || deviceType);
					} catch (error) {
						console.warn("[palata] no device type in deviceInfo", error);
					}
					if (deviceType === "mobile" || deviceType === "tablet") {
						document.body.classList.add("mobile-device");
					}

					emit("sdk_ready", JSON.stringify({
						language: language,
						device_type: deviceType
					}));

					// Godot may have reached the menu while init was still in
					// flight; replay both calls it could have made by now.
					if (loadingReported) {
						try {
							ysdk.features.LoadingAPI?.ready();
						} catch (error) {
							console.warn("[palata] deferred LoadingAPI.ready failed", error);
						}
					}
					if (gameplayRunning) {
						try {
							ysdk.features.GameplayAPI?.start();
						} catch (error) {
							console.warn("[palata] deferred GameplayAPI.start failed", error);
						}
					}

					sdk.on("game_api_pause", function () {
						emit("platform_pause", "");
					});
					sdk.on("game_api_resume", function () {
						emit("platform_resume", "");
					});

					// scopes:false keeps guests playing without a login prompt;
					// their data still round-trips through the platform.
					return sdk.getPlayer({ scopes: false });
				})
				.then(function (player) {
					if (!player) {
						return null;
					}
					ysdkPlayer = player;
					return player.getData(["palata0"]);
				})
				.then(function (data) {
					if (data && data.palata0) {
						emit("cloud_data", JSON.stringify(data.palata0));
					}
				})
				.catch(function (error) {
					console.warn("[palata] Yandex SDK unavailable", error);
					markSdkUnavailable();
				});
		}

		// --- portrait pause ------------------------------------------------------
		// The notice covers the whole screen, so without this the shift keeps
		// running behind it and an anomaly can kill a player who is only
		// turning their phone. Reuses the platform pause path, which is already
		// idempotent on the Godot side.
		let portraitPaused = false;
		function refreshOrientationPause() {
			if (!document.body.classList.contains("mobile-device")) {
				return;
			}
			const portrait = window.matchMedia("(orientation: portrait)").matches;
			if (portrait === portraitPaused) {
				return;
			}
			portraitPaused = portrait;
			emit(portrait ? "platform_pause" : "platform_resume", "");
		}
		window.matchMedia("(orientation: portrait)").addEventListener("change", refreshOrientationPause);

		// --- engine boot ----------------------------------------------------------
		const GODOT_CONFIG = $GODOT_CONFIG;
		const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

		const bootPanel = document.getElementById("boot");
		const bootFill = document.getElementById("boot-fill");
		const bootStatus = document.getElementById("boot-status");

		function showBootError(message) {
			bootPanel.classList.remove("boot--gone");
			bootStatus.classList.add("boot-status--error");
			bootStatus.textContent = message;
			bootFill.style.width = "0";
		}

		const missingFeatures = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missingFeatures.length > 0) {
			showBootError(shellText("missing") + " " + missingFeatures.join(", "));
			// Nothing will start, so release the platform's loading screen
			// rather than leaving the player on a spinner.
			markSdkUnavailable();
		} else {
			const engine = new Engine(GODOT_CONFIG);
			engine.startGame({
				onProgress: function (current, total) {
					if (total > 0) {
						bootFill.style.width = Math.min(100, (current / total) * 100) + "%";
					}
				}
			}).then(function () {
				bootFill.style.width = "100%";
				bootPanel.classList.add("boot--gone");
				// Godot reports the ward ready itself through loadingReady();
				// this only clears the shell's own overlay.
				window.setTimeout(function () {
					bootPanel.style.display = "none";
				}, 500);
				refreshOrientationPause();
			}).catch(function (error) {
				console.error("[palata] engine failed to start", error);
				showBootError(shellText("failed"));
				markSdkUnavailable();
			});
		}
	</script>
</body>
</html>
